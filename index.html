<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bee Biii!!! Happy 24th Birthday❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-background {
      background: rgb(255, 208, 229);
      background: linear-gradient(180deg, rgba(255, 208, 229, 1) 0%, rgba(255, 232, 242, 1) 36%, rgba(255, 255, 255, 1) 100%);
    }

    .bounce2 {
      animation: bounce2 2s ease infinite;
    }

    @keyframes bounce2 {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    /* Ensure responsive font size for mobile */
    .responsive-text {
      font-size: 6vw;
    }

    .responsive-button {
      font-size: 4vw;
      max-width: 80vw; /* Restricts button width to 80% of viewport */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Apply specific styles for different screen sizes */
    @media (min-width: 640px) {
      .responsive-text {
        font-size: 3vw;
      }

      .responsive-button {
        font-size: 1.2rem;
        max-width: 30vw; /* Adjust max-width appropriately for larger screens */
      }
    }
  </style>
</head>
<body class="gradient-background">
  <audio hidden controls autoplay loop id="myAudio">
    <source src="song.mp3" type="audio/mpeg">
  </audio>
  <div class="flex items-center justify-center h-screen">
    <div class="flex flex-col items-center p-4">
      <img id="imageDisplay" src="./images/1.gif" alt="" class="rounded-md h-[300px]" style="object-fit: cover;" />
      <h2 id="valentineQuestion" class="responsive-text text-4xl font-bold italic text-[#bd1e59] my-4 text-center">Bee Biii!!! Happy 24th Birthdayyyy😘😘</h2>
      <div class="flex gap-4 pt-4 items-center" id="responseButtons">
        <button id="yesButton"
          class="responsive-button bounce2 inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium disabled:pointer-events-none disabled:opacity-50 hover:bg-green-400 min-h-12 min-w-[75px] px-4 py-2 bg-green-500 text-white transition">
          我爱niiiii🥰
        </button>
        <button id="noButton"

          按我按我嘻嘻嘻👀
        </button>
      </div>
    </div>
  </div>

      "./images/8.gif",
      "./images/7.gif",
      "./images/5.gif",
      "./images/4.gif"
    ];

    noButton.addEventListener('click', function() {
      if (noClickCount < 5) {
        noClickCount++;
        imageDisplay.src = imagePaths[noClickCount];
        valentineQuestion.innerHTML = [
          "Biii~ Happy Birthdayyy!!!",
          "长大一岁loooo 今年第一次陪你过生日~",
          "这一年可能过得不太好 发生了一些事情 还要一个人去US那么久",
          "接下来的日子 有我在 我不会让你受伤derrr🥹",

          "很开心你有在慢慢的走进我的生活里陪伴我<br>我很喜欢你 在乎你 所以我满脑子都是我们❤️❤️<br>我真的好爱你呀啊啊啊啊啊🥰🥰"
        ][noClickCount]; // Change the question text
        yesButton.textContent = [
          "我爱niiiii🥰",
          "I Misss Youuu👉👈",
          "Hug Hug😚",
          "Kiss Kiss😘",
          "I Loveeee Youuuu!❤️",
          "I Loveeeeeeee Youuuuuuuu!!😘😘"
        ][noClickCount];

        if (noClickCount < 6) {
          noButton.textContent = [
            "按我按我嘻嘻嘻👀",
            "接下来都会有你陪我👀",
            "好naaaa👀",
            "我也是👀",
            "知道了naaa👀",
            "没有next了naa🙂‍↔️ 你就说你爱我baaaa嘻嘻"
          ][noClickCount];
        }
      }
    });

    function confettiEffect() {
    const colors = ['#ff4d88', '#ffcc00', '#66ccff', '#66ff99', '#cc66ff', '#ff6666'];

    for (let i = 0; i < 120; i++) {
        const piece = document.createElement('div');

        piece.style.position = 'fixed';
        piece.style.width = '10px';
        piece.style.height = '10px';
        piece.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '-20px';
        piece.style.zIndex = '9999';
        piece.style.pointerEvents = 'none';

        piece.style.transform =
            `rotate(${Math.random() * 360}deg)`;

        piece.style.transition =
            `top ${2 + Math.random() * 3}s linear,
             transform ${2 + Math.random() * 3}s linear`;

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.style.top = '110vh';
            piece.style.transform =
                `rotate(${720 + Math.random() * 720}deg)`;
        }, 10);

        setTimeout(() => {
            piece.remove();
        }, 5500);
    }
}

    yesButton.addEventListener('click', () => {
      document.getElementById("myAudio").play();
      imageDisplay.src = './images/10.jpg'; // Change to image7.gif
      valentineQuestion.innerHTML = "<br>生日快乐呀啊啊！！！<br>希望你天天都开开心心 一切都顺顺利利derrrr 接下来的日子会越来越好 越来越幸福😘😘😘<br><br>❤️❤️❤️等你回来Okayyyy❤️❤️❤️<br><br>By: 你专属的大朋友🥰"; // Change the question text
      responseButtons.style.display = 'none'; // Hide both buttons

      confettiEffect();
      //confetti(); // Trigger confetti animation
    });
  </script>
</body>
</html>
